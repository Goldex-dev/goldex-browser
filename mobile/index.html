<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLDEX Mobile</title>
    <meta name="description" content="GOLDEX — мобильный браузерный лобби">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GOLDEX">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="../assets/icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
    <div class="app" id="app">
        <div class="status-bar" id="statusBar">
            <div class="status-time" id="statusTime">12:00</div>
            <div class="status-icons">
                <svg class="status-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                <svg class="status-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zM13 18h-2v-2h2v2zm0-4h-2V9h2v5z"/></svg>
            </div>
        </div>

        <div class="orbs" id="orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>

        <main class="main-content" id="mainContent">
            <div class="page page-home active" id="pageHome">
                <div class="header">
                    <h1 class="logo">GOLDEX</h1>
                    <div class="clock" id="clock">12:00</div>
                    <div class="date" id="date">1 января, 2026</div>
                    <div class="greeting" id="greeting">Добрый день</div>
                </div>

                <div class="search-container">
                    <div class="search-box" id="searchBox">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" class="search-input" id="searchInput" placeholder="Поиск в Яндексе..." autocomplete="off">
                        <button class="search-clear" id="searchClear">&times;</button>
                    </div>
                    <div class="autocomplete" id="autocomplete"></div>
                </div>

                <div class="quick-sites">
                    <a href="https://youtube.com" class="site-item" data-site="youtube">
                        <div class="site-icon" style="background: #FF0000;">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M23.5 6.19a3.02 3.02 0 00-2.12-2.14C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.38.55A3.02 3.02 0 00.5 6.19 31.6 31.6 0 000 12a31.6 31.6 0 00.5 5.81 3.02 3.02 0 002.12 2.14c1.88.55 9.38.55 9.38.55s7.5 0 9.38-.55a3.02 3.02 0 002.12-2.14A31.6 31.6 0 0024 12a31.6 31.6 0 00-.5-5.81zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>
                        </div>
                        <span>YouTube</span>
                    </a>
                    <a href="https://vk.com" class="site-item" data-site="vk">
                        <div class="site-icon" style="background: #4C76A9;">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M15.68 2H8.32C3.94 2 2 3.94 2 8.32v7.36C2 20.06 3.94 22 8.32 22h7.36C20.06 22 22 20.06 22 15.68V8.32C22 3.94 20.06 2 15.68 2zm3.45 15.68c-.15.15-.33.15-.45.09-2.3-1.42-5.19-1.74-8.6-.96-.18.04-.33-.07-.38-.22-.05-.15.05-.33.22-.38 3.76-.86 6.92-.48 9.52 1.12.15.09.18.3.11.35zm.94-2.09c-.18.18-.45.15-.57.06-2.62-1.62-6.64-2.08-9.77-1.14-.22.07-.45-.04-.52-.22-.07-.22.04-.45.22-.52 3.61-1.1 8.04-.59 11.06 1.27.22.15.25.45.11.61-.11.12-.18.15-.33.06l-.2.04zm.08-2.17C16.58 12.13 10.25 11.92 6.6 12.94c-.27.07-.52-.07-.59-.33-.07-.27.07-.52.33-.59 4.14-1.18 11.25-1 15.69 1.35.25.15.33.48.15.73-.12.18-.33.22-.48.07l.04-.04zM9.55 4.82h4.9c.12 0 .18.07.18.18v5.32c0 .12-.07.18-.18.18s-.18-.07-.18-.18V6.77h-4.54v3.37c0 .12-.07.18-.18.18s-.18-.07-.18-.18V5c0-.12.07-.18.18-.18z"/></svg>
                        </div>
                        <span>VK</span>
                    </a>
                    <a href="https://google.com" class="site-item" data-site="google">
                        <div class="site-icon" style="background: #4285F4;">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" opacity=".7"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" opacity=".5"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" opacity=".3"/></svg>
                        </div>
                        <span>Google</span>
                    </a>
                    <a href="https://t.me" class="site-item" data-site="telegram">
                        <div class="site-icon" style="background: #0088CC;">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0h-.056zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.492-1.302.48-.428-.013-1.252-.242-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                        </div>
                        <span>Telegram</span>
                    </a>
                    <a href="https://wikipedia.org" class="site-item" data-site="wikipedia">
                        <div class="site-icon" style="background: #636466;">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        </div>
                        <span>Wikipedia</span>
                    </a>
                    <a href="https://reddit.com" class="site-item" data-site="reddit">
                        <div class="site-icon" style="background: #FF4500;">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M12 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 01-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 01.042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 014.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 01.14-.197.35.35 0 01.238-.042l2.906.617a1.214 1.214 0 011.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.687-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 00-.231.094.33.33 0 000 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 00.029-.463.33.33 0 00-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 00-.232-.095z"/></svg>
                        </div>
                        <span>Reddit</span>
                    </a>
                    <a href="https://github.com" class="site-item" data-site="github">
                        <div class="site-icon" style="background: #333;">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                        </div>
                        <span>GitHub</span>
                    </a>
                    <a href="https://spotify.com" class="site-item" data-site="spotify">
                        <div class="site-icon" style="background: #1DB954;">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                        </div>
                        <span>Spotify</span>
                    </a>
                </div>
            </div>

            <div class="page page-history" id="pageHistory">
                <div class="page-header">
                    <h2>История</h2>
                    <button class="page-action" id="clearHistory">Очистить</button>
                </div>
                <div class="page-body" id="historyList">
                    <div class="empty-state" id="historyEmpty">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48"><path d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                        <p>Нет истории</p>
                    </div>
                </div>
            </div>

            <div class="page page-favorites" id="pageFavorites">
                <div class="page-header">
                    <h2>Избранное</h2>
                    <button class="page-action" id="addFavorite">+ Добавить</button>
                </div>
                <div class="page-body" id="favoritesList">
                    <div class="empty-state" id="favoritesEmpty">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        <p>Нет избранных</p>
                    </div>
                </div>
            </div>

            <div class="page page-settings" id="pageSettings">
                <div class="page-header">
                    <h2>Настройки</h2>
                </div>
                <div class="page-body">
                    <div class="settings-group">
                        <h3>Поисковая система</h3>
                        <div class="settings-options" id="searchEngineOptions">
                            <label class="settings-radio"><input type="radio" name="searchEngine" value="yandex" checked><span>Яндекс</span></label>
                            <label class="settings-radio"><input type="radio" name="searchEngine" value="google"><span>Google</span></label>
                            <label class="settings-radio"><input type="radio" name="searchEngine" value="duckduckgo"><span>DuckDuckGo</span></label>
                            <label class="settings-radio"><input type="radio" name="searchEngine" value="bing"><span>Bing</span></label>
                        </div>
                    </div>
                    <div class="settings-group">
                        <h3>Тема оформления</h3>
                        <div class="settings-options" id="themeOptions">
                            <label class="settings-radio theme-radio">
                                <input type="radio" name="theme" value="dark" checked>
                                <span class="theme-preview theme-dark"></span>
                                <span>Тёмная</span>
                            </label>
                            <label class="settings-radio theme-radio">
                                <input type="radio" name="theme" value="light">
                                <span class="theme-preview theme-light"></span>
                                <span>Светлая</span>
                            </label>
                            <label class="settings-radio theme-radio">
                                <input type="radio" name="theme" value="gold">
                                <span class="theme-preview theme-gold"></span>
                                <span>Золотая</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item active" data-page="home">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Главная</span>
            </button>
            <button class="nav-item" data-page="history">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                <span>История</span>
            </button>
            <button class="nav-item" data-page="favorites">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                <span>Избранное</span>
            </button>
            <button class="nav-item" data-page="settings">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                <span>Настройки</span>
            </button>
        </nav>

        <div class="favorite-modal" id="favoriteModal">
            <div class="modal-content">
                <h3 id="modalTitle">Добавить в избранное</h3>
                <input type="text" id="favName" placeholder="Название" class="modal-input">
                <input type="url" id="favUrl" placeholder="URL" class="modal-input">
                <input type="text" id="favColor" placeholder="Цвет (hex)" class="modal-input" value="#B8860B">
                <div class="modal-actions">
                    <button class="modal-btn modal-cancel" id="modalCancel">Отмена</button>
                    <button class="modal-btn modal-save" id="modalSave">Сохранить</button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
